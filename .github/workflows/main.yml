name: Build EasyNits APK

on:
  workflow_dispatch: # Umožní ruční spuštění jedním kliknutím
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout kód repozitáře
        uses: actions/checkout@v4

      - name: Nastavit Javu (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Povolit spuštění Gradle wrapperu
        run: chmod +x gradlew

      - name: Vygenerovat debug keystore (vyžadováno projektem)
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Zkompilovat Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Uložit hotové APK k exportu
        uses: actions/upload-artifact@v4
        with:
          name: EasyNits-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
